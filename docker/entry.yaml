name: icasu

services:
  database:
    image: postgres:16
    container_name: icasu_postgres
    # env_file:
    #   - ./../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/backups:/backups_icasu
      - postgres:/var/lib/postgresql/icasu_data
  database_vector: 
    image: pgvector/pgvector:pg18-trixie
    container_name: icasu_pgvector
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_VECTOR}
    ports:
      - "5434:5432" 
    volumes:
      - postgres:/var/lib/postgresql/icasu_data

  # elasticsearch: 
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
